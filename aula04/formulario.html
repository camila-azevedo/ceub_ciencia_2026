<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1> 🎒 Escola Virtual 🏫</h1>
    <h2>Formulário de Pré-Matrícula</h2>
  
    <form action="" method="post">
  
      <fieldset>
        <legend><strong>Dados Pessoais</strong></legend>
  
        <div class="campo-grupo">
          <div class="campo">
            <label for="nome_aluno">Nome do Aluno</label>
            <input type="text" id="nome_aluno" name="nome_aluno" required>
          </div>
          <div class="campo">
            <label for="email">E-Mail</label>
            <input type="email" id="email" name="email">
          </div>
        </div>
  
        <div class="campo-grupo">
          <div class="campo">
            <label for="nome_mae">Nome da Mãe</label>
            <input type="text" id="nome_mae" name="nome_mae">
          </div>
          <div class="campo">
            <label for="nome_pai">Nome do Pai</label>
            <input type="text" id="nome_pai" name="nome_pai">
          </div>
        </div>
  
        <div class="campo-grupo">
          <div class="campo">
            <label for="nascimento">Nascimento</label>
            <input type="date" id="nascimento" name="nascimento">
          </div>
          <div class="campo">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" name="telefone" maxlength="15" placeholder="(61) 9 9999-9999">
          </div>
          <div class="campo">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="CPF" maxlength="14" placeholder="000.000.000-00">
          </div>
          <div class="campo">
            <label for="cep">CEP</label>
            <input type="text" id="cep" name="CEP" maxlength="9" placeholder="00.000-000">
          </div>
          <div class="campo">
            <label for="matricula">Matricula</label>
            <input type="text" id="matricula" name="Matricula" maxlength="14">
          </div>
          <div class="campo">
            <label for="idade">Idade</label>
            <input type="text" id="idade" name="idade" readonly>
          </div>
        </div>
      </fieldset>
  
      <fieldset>
        <legend><strong>Informações de Matrícula</strong></legend>
  
        <table>
          <tr valign="top">
            <td>
              <strong>Série</strong>
              <select id="serie" name="serie">
                <option value="pre-escolar">Pré-escolar</option>
                <option value="1ano">1º ano</option>
                <option value="2ano">2º ano</option>
                <option value="3ano">3º ano</option>
                <option value="4ano">4º ano</option>
                <option value="5ano">5º ano</option>
              </select>
            </td>
            <td>
              <strong>Turno</strong>
              <input type="radio" name="turno" id="manha" value="manha">
              <label for="manha">Manhã</label><br>
              <input type="radio" name="turno" id="tarde" value="tarde">
              <label for="tarde">Tarde</label>
            </td>
            <td>
              <strong>Atividades Extracurriculares</strong>
              <input type="checkbox" name="atividades" id="informatica" value="informatica">
              <label for="informatica">Informática</label><br>
              <input type="checkbox" name="atividades" id="musica" value="musica">
              <label for="musica">Música</label><br>
              <input type="checkbox" name="atividades" id="balet" value="balet">
              <label for="balet">Balé</label><br>
              <input type="checkbox" name="atividades" id="pintura" value="pintura">
              <label for="pintura">Pintura</label><br>
              <input type="checkbox" name="atividades" id="judo" value="judo">
              <label for="judo">Judô</label><br>
              <input type="checkbox" name="atividades" id="futebol" value="futebol">
              <label for="futebol">Futebol</label>
            </td>
          </tr>
        </table>

        <div class="campo2">
          <strong>Segunda Língua</strong><br>
          <input type="radio" name="lingua" id="ingles" value="ingles">
          <label for="ingles">Inglês</label><br>
          <input type="radio" name="lingua" id="espanhol" value="espanhol">
          <label for="espanhol">Espanhol</label>
        </div>
      </fieldset>

      <fieldset>
        <legend><strong>Endereço</strong></legend>
        <div class="campo-grupo">
          <div class="campo">
            <label for="logradouro">Logradouro</label>
            <input type="text" id="logradouro" name="logradouro" required readonly>
          </div>
          <div class="campo">
            <label for="numero">Número</label>
            <input type="text" id="numero" name="numero">
          </div>
          <div class="campo">
            <label for="complemento">Complemento</label>
            <input type="text" id="complemento" placeholder="Apto, Bloco..."> 
          </div>
          <div class="campo">
            <label for="bairro">Bairro</label>
            <input type="text" id="bairro" placeholder="Liberdade, República..." readonly>
          </div>
        </div>
        <div class="campo-grupo2">
          <div class="campo">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" readonly>
          </div>
          <div class="campo">
            <label for="estado">Estado</label>
            <input type="text" id="estado" readonly>
          </div>
          <div class="campo">
            <label for="ibge">Código IBGE</label>
            <input type="text" id="ibge" readonly>
          </div>
        </div>
      </fieldset>
  
      <div class="botoes">
        <input type="submit" value="Enviar Formulário">
        <input type="reset" value="Limpar Campos">
      </div>
  
    </form>

    <script>
      const campoCep = document.getElementById('cep');
      campoCep.addEventListener('input', function(){
          let valor = this.value.replace(/\D/g, '');
          if(valor.length > 5){
            valor = valor.slice(0,5) + '-' + valor.slice(5,8);
          }
          this.value = valor;
          
          if(valor.length === 9){
            buscarCep(valor.replace('-', ''));
          }
      });

      const campoCpf = document.getElementById('cpf');
      campoCpf.addEventListener('input', function(){
          let valor = this.value.replace(/\D/g, '');
          if (valor.length > 9) { 
            valor = valor.slice(0, 3) + '.' + valor.slice(3, 6) + '.' + valor.slice(6, 9) + '-' + valor.slice(9); 
          } else if (valor.length > 6) { 
            valor = valor.slice(0, 3) + '.' + valor.slice(3, 6) + '.' + valor.slice(6); 
          } else if (valor.length > 3) { 
            valor = valor.slice(0, 3) + '.' + valor.slice(3); 
          } 
          this.value = valor;
      });

      function calcularIdade() {
        const campoNascimento = document.getElementById("nascimento");
        const campoIdade = document.getElementById("idade");

        if (!campoNascimento.value) {
          campoIdade.value = "";
          return;
        }

        const nascimento = new Date(campoNascimento.value);
        const hoje = new Date();

        let idade = hoje.getFullYear() - nascimento.getUTCFullYear();
        const mes = hoje.getMonth() - nascimento.getUTCMonth();
        const dia = hoje.getDate() - nascimento.getUTCDate();

        if (mes < 0 || (mes === 0 && dia < 0)) {
          idade--;
        }

        campoIdade.value = idade >= 0 ? idade + " anos" : "";
      }

      document.getElementById("nascimento").addEventListener("change", calcularIdade);

      function buscarCep(cep) {
        fetch(`https://viacep.com.br/ws/${cep}/json/`)
          .then(resposta => resposta.json())
          .then(dados => {
            if (!dados.erro) {
              document.getElementById('logradouro').value = dados.logradouro;
              document.getElementById('bairro').value = dados.bairro;
              document.getElementById('cidade').value = dados.localidade;
              document.getElementById('estado').value = dados.uf;
              document.getElementById('ibge').value = dados.ibge;
            }
          });
      }

      campoCep.addEventListener('blur', async function () {
    const cep = this.value.replace(/\D/g, '');

    if (cep.length !== 8) {
        alert('CEP inválido.');
        return;
    }

    try {
        const resposta = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const dados = await resposta.json();

        if (dados.erro) {
            alert('CEP não encontrado.');
            return;
        }

        document.getElementById('logradouro').value = dados.logradouro;
        document.getElementById('bairro').value = dados.bairro;
        document.getElementById('cidade').value = dados.localidade;
        document.getElementById('estado').value = dados.uf;
        document.getElementById('ibge').value = dados.ibge;
    } catch (erro) {
        alert('Erro ao consultar o CEP.');
    }
});
    </script>
</body>
</html>
