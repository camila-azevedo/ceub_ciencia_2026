
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

        body{
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
          font-size: 16px;
          background-color: pink;
          color: palevioletred;
          min-height: 100vh;
        }

        h1{
          background-color: rgb(243, 113, 152);
          color: rgb(255, 255, 255);
          text-align: center;
          padding: 30px 20px;
          font-size: 35px;
          letter-spacing: 1px;
          border-radius: 10px;
        }

        h2{
          text-align: center;
          color: 
          rgb(192, 73, 102);
          font-weight: bold;
          margin: 40px 0 30px;
          font-size: 22px;
          letter-spacing: 1px;
        }

        form{
          width: 90%;
          max-width: 960px;
          margin: 0 auto 60px auto;
          background-color: rgb(247, 225, 231);
          padding: 50px 60px;
          border-radius: 15px;
          color: rgb(194, 56, 97);
          box-shadow: 0 4px 20px black;
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif

        }

        fieldset{
          border: 2px solid pink;
          border-radius: 8px;
          padding: 30px 35px;
          margin-bottom: 35px;
        }

        legend{
          background-color: pink;
          color: rgb(255, 255, 255);
          padding: 7px 18px;
          border-radius: 5px;
          font-size: 15px;
          letter-spacing: 1px;
        }

        .campo-grupo{
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 20px 40px;
          margin-bottom: 20px;
          
        }
        
        .campo{
          display: flex;
          flex-direction: column;
          margin-bottom: 20px;
        }

        label{
          display: inline-block;
          margin-bottom: 8px;
          font-weight: bold;
          color: rgb(160, 12, 69);
          font-size: 14px;
          text-transform: uppercase;
          letter-spacing: 0.5px;
        }

        input[type='text'], 
              [type='date'], 
              [type='email'] {
          padding: 10px 14px;
          border: 1px solid grey;
          border-radius: 5px;
          font-size: 15px;
          background-color: rgb(255, 255, 255);
          transition: border-color 0.3s, box-shadow 0.3s;
        }

        .campo input[type='text'],
        .campo input[type='date'], 
        .campo input[type='email']{
          width: 100%;
        }

        input[type='text']:focus,
        input[type='date']:focus,
        input[type='email']:focus{
          border-color: dimgray;
          box-shadow: 0 0 0 3px black;
          outline: none;
          background-color: white;
        }

        select{
          padding: 10px 14px;
          border: 1px solid rgb(173, 49, 118);
          outline: none;
          background-color: rgb(250, 237, 239);
          font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
          font-weight: 500;

        }

        table{
          width: 100%;
          border-collapse: separate;
          border-spacing: 0;
        }

        td{
          padding: 15px 20px;
          vertical-align: top;
          border-right: 1px solid palevioletred;
          width: 33.33;
        }

        td:last-child{
          border-right: none;
        }

        td > b, td > strong{
          display: block;
          font-size: 14px;
          text-transform: uppercase;
          letter-spacing: 0.5px;
          color: hotpink;
          margin-bottom: 12px;
        }

        input[type='radio'],
        input[type='checkbox']{
          margin-right: 8px;
          cursor: pointer;
          accent-color: black;
          width: 15px;
          height: 15px;
        }

        td label{
          text-transform: none;
          letter-spacing: 0;
          font-weight: normal;
          font-size: 15px;
          display: inline;
          margin-bottom: 0;
        }
      
        input[type="submit"]{
          padding: 15px 20px;
          background-color: #d4edda;
          color: #155724;
          border: 1px solid #c3e6cb;
          border-radius: 4px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        max-width: 400px;
        }

        input[type="reset"]{
          padding: 15px 20px;
          background-color: #edd4d4;
          color: #b41a1a;
          border: 1px solid #e6c3c3;
          border-radius: 4px;
          display: flex;
          justify-content: space-between;
          align-items: center;
        max-width: 400px;
        }

    </style>
</head>
<body>

    <h1> 🎒 Escola Virtual 🏫</h1>
    <h2>Formulário de Pré-Matrícula</h2>
  
    <form action="" method="post">
  
      <fieldset>
        <legend><strong>Dados Pessoais</strong></legend>
  
        <div class="campo-grupo">
          <div class="campo">
            <label for="nome_aluno">Nome do Aluno</label>
            <input type="text" id="nome_aluno" name="nome_aluno" required>
          </div>
          <div class="campo">
            <label for="email">E-Mail</label>
            <input type="email" id="email" name="email">
          </div>
        </div>
  
        <div class="campo-grupo">
          <div class="campo">
            <label for="nome_mae">Nome da Mãe</label>
            <input type="text" id="nome_mae" name="nome_mae">
          </div>
          <div class="campo">
            <label for="nome_pai">Nome do Pai</label>
            <input type="text" id="nome_pai" name="nome_pai">
          </div>
        </div>
  
        <div class="campo-grupo">
          <div class="campo">
            <label for="nascimento">Nascimento</label>
            <input type="date" id="nascimento" name="nascimento">
          </div>
          <div class="campo">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" name="telefone" maxlength="15" placeholder="(61) 9 9999-9999">
          </div>
        </div>
  
      </fieldset>
  
      <fieldset>
        <legend><strong>Informações de Matrícula</strong></legend>
  
        <table>
          <tr valign="top">
            <td>
              <strong>Série</strong>
              <select id="serie" name="serie">
                <option value="pre-escolar">Pré-escolar</option>
                <option value="1ano">1º ano</option>
                <option value="2ano">2º ano</option>
                <option value="3ano">3º ano</option>
                <option value="4ano">4º ano</option>
                <option value="5ano">5º ano</option>
              </select>
            </td>
  
            <td>
              <strong>Turno</strong>
              <input type="radio" name="turno" id="manha" value="manha">
              <label for="manha">Manhã</label><br>
              <input type="radio" name="turno" id="tarde" value="tarde">
              <label for="tarde">Tarde</label>
            </td>
  
            <td>
              <strong>Atividades Extracurriculares</strong>
              <input type="checkbox" name="atividades" id="informatica" value="informatica">
              <label for="informatica">Informática</label><br>
  
              <input type="checkbox" name="atividades" id="musica" value="musica">
              <label for="musica">Música</label><br>
  
              <input type="checkbox" name="atividades" id="balet" value="balet">
              <label for="balet">Balé</label><br>
  
              <input type="checkbox" name="atividades" id="pintura" value="pintura">
              <label for="pintura">Pintura</label><br>
  
              <input type="checkbox" name="atividades" id="judo" value="judo">
              <label for="judo">Judô</label><br>
  
              <input type="checkbox" name="atividades" id="futebol" value="futebol">
              <label for="futebol">Futebol</label>
            </td>
          </tr>
        </table>
      </fieldset>
  
      <div class="botoes">
        <input type="submit" value="Enviar Formulário">
        <input type="reset" value="Limpar Campos">
      </div>
  
    </form>
  
  </body>
</html>
